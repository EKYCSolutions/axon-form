name: axon_form_flutter
description: "A cross-platform Flutter plugin for building and rendering dynamic forms with configurable fields, validation, and file uploads."
version: 0.0.4
homepage: https://ekycsolutions.com
repository: https://github.com/EKYCSolutions/axon_form_flutter

environment:
  sdk: ^3.8.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  intl: ^0.20.2
  ffi: ^2.1.4
  provider: ^6.0.0
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.axon_form_flutter
        ffiPlugin: true
      ios:
        ffiPlugin: true
      web:
        pluginClass: AxonFormFlutterWeb
        fileName: axon_form_flutter_web.dart
  assets:
    - web/wasm_exec.js
    - web/axonlib.wasm
